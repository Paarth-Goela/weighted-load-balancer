global
    log stdout format raw local0

    # ------------------------------------------------------------------
    # Runtime API (Milestone 2)
    # ------------------------------------------------------------------
    # Administrative Unix socket used to change server weights at runtime
    # without restarting or reloading HAProxy.
    #
    # Protection:
    #   * Unix socket only -- no TCP listener, no published Docker port.
    #   * mode 600 -> only the 'haproxy' user inside the container can use it.
    #   * Reachable from the host only via `docker exec haproxy socat ...`,
    #     i.e. only by someone who already controls the Docker daemon.
    #   * Backends on the shared bridge network cannot reach it.
    #
    # /var/lib/haproxy is owned by the 'haproxy' user in the official image.
    stats socket /var/lib/haproxy/admin.sock mode 600 level admin
    stats timeout 10s

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_frontend
    bind *:8080
    default_backend http_backends

backend http_backends
    # 'roundrobin' is HAProxy's *dynamic* weighted round-robin: it honours
    # per-server weights and allows them to be changed at runtime through the
    # Runtime API. (Do NOT use 'static-rr': its weights cannot be changed
    # on the fly.)
    balance roundrobin

    # Layer 7 health check against the backend application.
    option httpchk GET /health
    http-check expect status 200

    # Boot-time weights. Traffic share = weight / sum(weights).
    # 50:50 keeps Milestone 1 behaviour (strict A/B alternation) as default.
    # Weights are changed at runtime with runtime/set_weights.py.
    # Valid HAProxy weight range: 0..256 (0 = receive no new traffic).
    server backend-a backend-a:8000 check inter 3s fall 3 rise 2 weight 50
    server backend-b backend-b:8000 check inter 3s fall 3 rise 2 weight 50
