global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_frontend
    bind *:8080
    default_backend http_backends

backend http_backends
    balance roundrobin
    server backend-a backend-a:8000
    server backend-b backend-b:8000
