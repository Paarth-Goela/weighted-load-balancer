global
    log stdout format raw local0

    # ------------------------------------------------------------------
    # Runtime API (private admin socket)
    # ------------------------------------------------------------------
    # * Unix socket only: no TCP listener, no published port.
    # * mode 600: only the 'haproxy' user (uid 99) can connect.
    # * /var/lib/haproxy is a named Docker volume shared read-only with the
    #   traffic-manager container, which runs as uid 99. No other container
    #   mounts it.
    # * Host operators can still use: docker exec haproxy socat ...
    stats socket /var/lib/haproxy/admin.sock mode 600 level admin
    stats timeout 10s

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

# ======================================================================
# Tier 1: public entry point and pool selection (traffic policy)
# ======================================================================
frontend http_frontend
    bind *:8080
    default_backend traffic_policy

# Pool-level split between Apigee OPDK and Apigee Hybrid.
#   share(OPDK) = weight(opdk) / (weight(opdk) + weight(hybrid))
# These weights ARE the traffic policy. They are changed at runtime by the
# traffic-manager (or runtime/set_weights.py) via the Runtime API.
# Boot default 100:0 = OPDK baseline; the traffic-manager re-applies the
# saved policy after an HAProxy restart.
#
# Each "server" is an in-process link (abstract Unix socket) to a pool
# frontend below. Its health check asks that frontend whether the pool has
# at least one usable instance. A pool with no usable instance is marked
# DOWN, so it receives no traffic regardless of its weight.
backend traffic_policy
    balance roundrobin
    option httpchk GET /__pool_ready
    server opdk   abns@apigee_opdk_pool   weight 100 check inter 1s fall 2 rise 1
    server hybrid abns@apigee_hybrid_pool weight 0   check inter 1s fall 2 rise 1

# ======================================================================
# Tier 2: one frontend + backend per gateway pool
# ======================================================================
# Metrics: each pool frontend also sends one compact line per request
#   "M <pool backend> <server> <HTTP status> <Tr ms> <Tt ms>"
# to a Unix DATAGRAM socket that the traffic-manager creates on the shared
# runtime volume. It is fire-and-forget: if nobody is listening, HAProxy
# drops the line and routing is unaffected. The traffic-manager derives
# per-pool request counts, error rates and p95 latency from it (HAProxy's own
# stats only provide averages). These two frontends' stdout log lines use the
# same compact format.
frontend apigee_opdk_entry
    bind abns@apigee_opdk_pool
    monitor-uri /__pool_ready
    monitor fail if { nbsrv(apigee_opdk_pool) eq 0 }
    # Per-request metric stream for the traffic-manager (see above).
    log /var/lib/haproxy/metrics.sock format raw local1 info
    log-format "M %b %s %ST %Tr %Tt"
    default_backend apigee_opdk_pool

frontend apigee_hybrid_entry
    bind abns@apigee_hybrid_pool
    monitor-uri /__pool_ready
    monitor fail if { nbsrv(apigee_hybrid_pool) eq 0 }
    # Per-request metric stream for the traffic-manager (see above).
    log /var/lib/haproxy/metrics.sock format raw local1 info
    log-format "M %b %s %ST %Tr %Tt"
    default_backend apigee_hybrid_pool

# Instance-level load balancing inside each pool. Instance weights are
# separate from the pool weights above: they only split a pool's share
# between that pool's own instances.
#
# Servers (gateway instances) are NOT listed here. The traffic-manager
# registers them at runtime with `add server` from its SQLite database.
# They start in maintenance and are enabled only after its health monitor
# has verified readiness.
#
# The HAProxy-native check below is a fast safety net. The traffic-manager's
# monitor is the authority for per-instance readiness: it supports per-instance
# path, status codes, Host header and SNI. The native check path is set per
# pool through environment variables (see docker-compose.yml).
backend apigee_opdk_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri "${OPDK_NATIVE_CHECK_PATH}"
    http-check expect status 200

backend apigee_hybrid_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri "${HYBRID_NATIVE_CHECK_PATH}"
    http-check expect status 200
